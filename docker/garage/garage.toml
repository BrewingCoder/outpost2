# Garage — S3-compatible object store for dev.
# Chosen over MinIO because MinIO's images are no longer pullable from Docker Hub or
# quay.io, and because cluster-ops flagged Garage as the better fit for the NFS-backed
# lab cluster — so dev and prod stay on the same implementation, not just the same API.
#
# What we actually depend on is RANGED READS (S3 GetObject with Range): large mail
# attachments stream to Microsoft Graph in 320 KiB-multiple chunks and must never be
# buffered whole (OP2-10, OP2-16).

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# Dev-only fixed secret so the single-node layout is reproducible across rebuilds.
rpc_secret = "d19b2f6e4a7c8051b3e6d4f29a7c1e83b5d0a6c4f8e2b7193d5a0c6e8f4b2d7a"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "op2-dev-admin"
metrics_token = "op2-dev-metrics"
