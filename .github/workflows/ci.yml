name: CI

# Fast gate, runs on every push and PR: build, test with coverage, migration-drift check.
# Nothing here installs a scanner binary — that is what makes it fast, and it is why the
# security chain lives in nightly.yml instead.
#
# What "CI" means is defined in build/Build.cs, not here. This workflow's only job is to
# provide a machine and the services, then call `tamp Ci`. A pipeline whose logic lives in
# YAML can only be debugged by pushing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    # The integration suites talk to real Postgres, Vault and Garage rather than fakes, and
    # skip themselves when the services are absent. Supplying them is the difference
    # between 361 tests running and a large fraction quietly not.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: outpost2
          POSTGRES_PASSWORD: outpost2-dev
          POSTGRES_DB: outpost2
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U outpost2"
          --health-interval 5s --health-timeout 5s --health-retries 10

      vault:
        image: hashicorp/vault:1.18
        env:
          VAULT_DEV_ROOT_TOKEN_ID: op2-dev-root
          VAULT_DEV_LISTEN_ADDRESS: '0.0.0.0:8200'
        ports: ['8200:8200']

    steps:
      # A shallow clone is fine here. The history secret scan lives in nightly.yml, which
      # fetches everything — scanning one commit and reporting clean is the most dangerous
      # possible outcome for a secret gate.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Enable Vault transit
        env:
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: op2-dev-root
        run: |
          curl -sf -X POST -H "X-Vault-Token: $VAULT_TOKEN" \
            -d '{"type":"transit"}' "$VAULT_ADDR/v1/sys/mounts/op2-transit"
          curl -sf -X POST -H "X-Vault-Token: $VAULT_TOKEN" \
            -d '{"type":"aes256-gcm96"}' "$VAULT_ADDR/v1/op2-transit/keys/op2-kek"

      - run: dotnet tool restore

      - name: tamp Ci
        env:
          # Absent secrets mean the reporter returns null and the framework skips it, so a
          # fork's CI stays quiet rather than failing on a missing token.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: dotnet tamp Ci --reporter=json --events artifacts/events.ndjson

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            artifacts/coverage/**/*.trx
            artifacts/coverage.cobertura.xml
            artifacts/events.ndjson
          if-no-files-found: ignore
